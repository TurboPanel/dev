[defaults]
# Repo-root ansible.cfg for IDE ansible-lint (redhat.ansible language server).
# Lint runs with cwd = the multi-root workspace folder for this repo (~/dev),
# so only this file is auto-loaded as ansible.cfg — NOT orchestration/ansible.cfg.
# Note: `ansible.config.path` is not a setting in redhat.ansible 26.x; do not
# rely on it. Runtime converge still uses orchestration/ansible.cfg +
# ANSIBLE_ROLES_PATH from the daemon (dev-orchestration.ts).
#
# Playbooks and overlay roles live under orchestration/; production roles come
# from the sibling daemon checkout (standard layout: ~/dev + ~/daemon).
roles_path = orchestration/roles:../daemon/orchestration/roles
collections_path = /opt/turbopanel/vendor/ansible/galaxy-collections:/usr/share/ansible/collections
