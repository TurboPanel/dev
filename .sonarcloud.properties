# Vestigial mirror of sonar-project.properties for SonarLint Connected Mode.
# CI uses sonar-project.properties. Automatic Analysis must stay off
# (Administration → Analysis Method).

sonar.projectKey=turbopanel_dev
sonar.projectName=dev
sonar.organization=turbopanel

sonar.python.version=3.14

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sources=src,scripts
sonar.tests=src
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx

sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**,\
  .local/**,\
  THIRD_PARTY_NOTICES.md

sonar.coverage.exclusions=\
  node_modules/**,\
  dist/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.tsx,\
  **/*.d.ts,\
  scripts/**,\
  src/app.tsx,\
  src/tui.tsx,\
  src/dev-services.ts,\
  src/theme.ts,\
  src/components/**,\
  src/lib/converge-service-log.ts,\
  src/lib/daemon-log.ts,\
  src/lib/daemon-install.ts,\
  src/lib/docker-access.ts,\
  src/lib/drizzle-studio.ts,\
  src/lib/instance-runtime.ts,\
  src/lib/open-url.ts,\
  src/lib/platform-docker-resources.ts,\
  src/lib/postgres-runtime.ts,\
  src/lib/reset-dev-database.ts,\
  src/lib/service-open.ts,\
  src/lib/service-restart.ts,\
  src/lib/spawn-trusted.ts,\
  src/lib/stack-versions.ts,\
  THIRD_PARTY_NOTICES.md

sonar.issue.ignore.multicriteria=denoS2187,posixBracket,posixReturn,cleartextProbe
sonar.issue.ignore.multicriteria.denoS2187.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.denoS2187.resourceKey=**/*.test.ts
sonar.issue.ignore.multicriteria.posixBracket.ruleKey=shelldre:S7688
sonar.issue.ignore.multicriteria.posixBracket.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.posixReturn.ruleKey=shelldre:S7682
sonar.issue.ignore.multicriteria.posixReturn.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.cleartextProbe.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.cleartextProbe.resourceKey=**/debug-hosting-probe.sh
