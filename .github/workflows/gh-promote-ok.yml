# Reusable "promote-ok" evaluation — a check on the two automatic promotion
# PRs, so each is mergeable only once the thing its merge publishes exists.
#
#   base staging  "Release Candidate x.y.z-rc.N" (head trunk). Merging runs
#                 publish-rc.yml, which publishes an rc from the canary built
#                 from the head commit. Green only when that commit's trunk CI
#                 run (`ci-workflow`, push or manual run on trunk) succeeded
#                 and, unless repo-kind is notes-only, a canary manifest that
#                 names exactly that commit is on the rolling `canary` release.
#   base live     "Release x.y.z" (head staging). Merging runs
#                 publish-release.yml, which releases the newest rc that has
#                 not shipped (read from the tags). Green
#                 only when that rc's GitHub release is published and
#                 staging's head is exactly its content (the rc commit is in
#                 staging and the trees match).
#
# It never re-runs tests, and it never waits: it looks once and ends in
# seconds. It reports the required check itself: a check run named
# `promote-ok` on the PR's head commit, written through the Checks API with
# the job token (so it belongs to the GitHub Actions app the rulesets pin it
# to) by scripts/promote/promote-ok-report.sh:
#
#   ready      success
#   not yet    in_progress: pending, so the PR cannot merge, and the trunk
#              commit that is the Release Candidate PR's head shows a pending
#              dot, not a red X (a "not yet" is never a failure)
#   never      failure (or the look itself failed)
#
# gh-promote-ok-recheck.yml, which the caller runs when the trunk CI, the
# canary build or Publish Release Candidate finishes, looks again then and
# updates the same check. It used to poll in place for up to an hour, and with
# many merges a day those idle jobs held the runners the canary builds they
# waited for needed. The logic is scripts/promote/promote-ok.sh (unit tests in
# src/lib/promote-ok-script.test.ts).
#
# No job here or in the caller may be named promote-ok: a job can only end
# success, failure, cancelled or skipped, and skipped passes a required check.
# A caller looks like:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened]
#       branches: [staging, live]
#   concurrency:   # one evaluation per head; a superseded head ends on its own
#     group: promote-ok-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
#     cancel-in-progress: true
#   jobs:
#     evaluate:
#       uses: TurboPanel/dev/.github/workflows/gh-promote-ok.yml@<sha>
#       with: { repo-kind: …, ci-workflow: …, dev-ref: <sha>,
#               base: ${{ github.event.pull_request.base.ref }},
#               head-sha: ${{ github.event.pull_request.head.sha }} }
#       permissions: { contents: read, actions: read, pull-requests: read, checks: write }
#
# Never add workflow_dispatch to that caller: a dispatch run on trunk would
# judge the trunk head without a PR. The manual dry run lives in the recheck
# caller and passes `pr-number` instead; a dry run writes no check.

# Permissions — the caller's job must grant at least:
#
#   permissions:
#     contents: read
#     actions: read
#     pull-requests: read
#     checks: write
#
# contents: the canary release and its manifests, tags, releases and commits.
# actions: the trunk CI run of the head commit.
# pull-requests: only the dry run, which reads base and head from a PR number.
# checks: the promote-ok check run (never written by a dry run). A caller job
# that grants less than this workflow declares fails before any step runs
# ("The nested job … is requesting …, but is only allowed …").

name: Promote OK

on:
  workflow_call:
    inputs:
      repo-kind:
        description: daemon | instance | ui | notes-only (notes-only has no canary to wait for)
        required: true
        type: string
      ci-workflow:
        description: The trunk CI workflow file whose green run a canary follows (publish-daemon-trunk.yml, build.yml, verify.yml)
        required: true
        type: string
      dev-ref:
        description: The TurboPanel/dev commit this workflow was called at (must equal the `uses:` pin — the script lives there)
        required: true
        type: string
      base:
        description: The PR's base branch (staging or live); empty with pr-number
        required: false
        type: string
        default: ""
      head-sha:
        description: The PR's head commit the check reports on; empty with pr-number
        required: false
        type: string
        default: ""
      pr-number:
        description: Dry run — read base and head from this PR instead
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: write

jobs:
  evaluate:
    name: evaluate
    runs-on: ubuntu-latest
    # promote-ok.sh looks once and ends; it never waits for a build.
    timeout-minutes: 5
    steps:
      - name: Check out the promotion scripts (TurboPanel/dev)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/dev
          ref: ${{ inputs.dev-ref }}
          path: .promote
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/promote
          sparse-checkout-cone-mode: false

      - name: Check that what this PR publishes exists, and report promote-ok
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_KIND: ${{ inputs.repo-kind }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          BASE: ${{ inputs.base }}
          HEAD_SHA: ${{ inputs.head-sha }}
          PR_NUMBER: ${{ inputs.pr-number }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          VERDICT_FILE="$(mktemp)"
          export VERDICT_FILE
          rc=0
          sh .promote/scripts/promote/promote-ok.sh || rc=$?
          # A dry run (pr-number) only shows the verdict, as this step's result.
          if [ -n "$PR_NUMBER" ]; then
            exit "$rc"
          fi
          sh .promote/scripts/promote/promote-ok-report.sh
