# Reusable "start the next number" — the last step after a release.
#
# Once vX.Y.Z is released, trunk still says X.Y.Z; the next canary must carry
# the next number. This opens ONE PR into trunk that bumps the repo's version
# files (`version-files`, one path per line) to:
#
#   - the next patch (default), or
#   - the next minor when any PR merged since the previous release carries the
#     `minor` label, and in either case
#   - never below the highest minor any TurboPanel repo is already on
#     (deno.json / package.json on each repo's trunk; the future catalog repo
#     is not part of the floor).
#
# The PR is opened with the Release App token so `ci-ok` runs on it. Nothing
# merges itself: the owner merges (squash). Idempotent — if trunk is already
# past the released version, or the PR is open, it does nothing.

# Permissions — the caller's job must grant at least:
#
#   permissions:
#     contents: read
#
# Every write (the branch push, the PR) uses the Release App token, so the
# GITHUB_TOKEN only checks out TurboPanel/dev. A caller job that grants less
# than this workflow declares fails before any step runs ("The nested job …
# is requesting …, but is only allowed …").

name: Start the Next Version

on:
  workflow_call:
    inputs:
      released-version:
        description: The version that just shipped (X.Y.Z)
        required: true
        type: string
      version-files:
        description: Files that declare the version, one path per line
        required: true
        type: string
      dev-ref:
        description: TurboPanel/dev commit carrying scripts/promote/cli.mjs
        required: true
        type: string
    secrets:
      RELEASE_APP_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  next-version-pr:
    runs-on: ubuntu-latest
    concurrency:
      group: gh-next-version-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Mint a Release App token (every TurboPanel repo, for the floor)
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: TurboPanel
          repositories: |
            turbopaneld
            turbopanel
            ui
            website
            dev

      - name: Check out trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: trunk
          token: ${{ steps.app.outputs.token }}
          path: repo
          fetch-depth: 1

      - name: Check out the promotion scripts (TurboPanel/dev)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/dev
          ref: ${{ inputs.dev-ref }}
          path: .promote
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/promote
          sparse-checkout-cone-mode: false

      - name: Work out the next number and open the PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          RELEASED: ${{ inputs.released-version }}
          FILES: ${{ inputs.version-files }}
          CLI: ${{ github.workspace }}/.promote/scripts/promote/cli.mjs
        run: |
          set -eu
          printf '%s\n' "$FILES" | grep -v '^$' > "$RUNNER_TEMP/files.txt"
          first="$(head -n 1 "$RUNNER_TEMP/files.txt")"

          # Trunk already moved past the release (a re-run, or someone bumped by hand).
          current="$(cd repo && node -e 'const t=require("fs").readFileSync(process.argv[1],"utf8");const m=/"version"\s*:\s*"([^"]+)"|sonar\.projectVersion=(\S+)/.exec(t);console.log(m[1]||m[2])' "$first")"
          if [ "$current" != "$RELEASED" ]; then
            echo "trunk is at $current, not $RELEASED — nothing to start"
            exit 0
          fi

          # Highest minor across every TurboPanel repo's trunk.
          : > "$RUNNER_TEMP/versions.txt"
          for spec in turbopaneld:deno.json turbopanel:deno.json ui:package.json website:package.json; do
            r="${spec%%:*}"; f="${spec#*:}"
            v="$(gh api "repos/TurboPanel/$r/contents/$f?ref=trunk" --jq .content | base64 -d | jq -r '.version // empty')" || v=""
            case "$v" in [0-9]*.[0-9]*.[0-9]*) echo "${v%%-*}" >> "$RUNNER_TEMP/versions.txt" ;; *) echo "::warning::no version read from $r/$f — left out of the minor floor" ;; esac
          done

          # A `minor` label on any PR merged since the previous release.
          since="$(gh release list --repo "$REPO" --exclude-pre-releases --limit 2 --json publishedAt --jq '.[1].publishedAt // "1970-01-01T00:00:00Z"')"
          minor=false
          if [ -n "$(gh pr list --repo "$REPO" --base trunk --state merged --label minor --search "merged:>=$since" --json number --jq '.[0].number // empty')" ]; then
            minor=true
          fi

          next="$(node "$CLI" next-version --current "$RELEASED" --minor "$minor" --versions "$RUNNER_TEMP/versions.txt" | sed -n 's/^next=//p')"
          branch="release/start-$next"
          if [ -n "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
            echo "PR for $branch is already open"
            exit 0
          fi

          cd repo
          node "$CLI" bump-files --from "$RELEASED" --to "$next" --files "$RUNNER_TEMP/files.txt"
          git config user.name "turbopanel-release[bot]"
          git config user.email "turbopanel-release[bot]@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add -- $(cat "$RUNNER_TEMP/files.txt")
          git commit -q -m "Start $next"
          git push -q origin "$branch"
          kind="patch"; [ "$minor" = "true" ] && kind="minor (a merged PR carried the minor label)"
          gh pr create --repo "$REPO" --base trunk --head "$branch" \
            --title "Start $next" \
            --body "v$RELEASED shipped. This moves trunk to **$next** ($kind; never below the highest minor across the TurboPanel repos) so the next canary carries the right number. Squash-merge when \`ci-ok\` is green; label any PR \`minor\` before the next release to make it a minor."

          # A new minor moves turbopaneld, turbopanel and ui together: give the
          # other two the same Start PR (repos already on it are left alone).
          if [ "${next%.*}" != "${RELEASED%.*}" ]; then
            cd "$GITHUB_WORKSPACE"
            CLI="$CLI" sh .promote/scripts/promote/start-minor.sh "$next" "${REPO#TurboPanel/}"
          fi
