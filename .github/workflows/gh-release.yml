# Reusable release-publish workflow, called by TurboPanel/turbopaneld,
# TurboPanel/website, and TurboPanel/dev's own tag-triggered
# .github/workflows/release.yml — see the Road to 0.1.x page's `other-repos`
# item. Kept centralized here (rather than duplicated per repo) because `dev`
# is already the cross-repo tooling home (dev/scripts/ci-verify.sh already
# orchestrates all five repos from here).
#
# This workflow does the part that's the same for every repo: create the
# GitHub Release on the tag, attach whatever assets the calling workflow
# already built and uploaded as a job artifact, and — when a manifest.json is
# among those assets — re-verify every artifact's sha256 against it once it's
# actually on the release, the same "don't trust the upload, re-download and
# hash it" check publish-daemon-trunk.yml already does against the CDN. The
# verifier walks the manifest for any object carrying url + sha256 + size,
# so the daemon's shape (binaryArtifacts / jsFallbackArtifact /
# orchestrationArtifact) and the instance's and UI's (artifacts.<name>)
# share one code path.
#
# What it deliberately does NOT do: build or package anything repo-specific.
# turbopaneld's compile/package/verify-release-root steps stay in
# turbopaneld/.github/workflows/release.yml; this workflow only ever receives
# already-built files via actions/upload-artifact from the calling job.

name: GitHub Release

on:
  workflow_call:
    inputs:
      version:
        description: Release version without a leading v (e.g. 0.1.0-rc1)
        required: true
        type: string
      channel:
        description: Channel this release publishes to (e.g. rc, release, or a throwaway test channel for a dry run)
        required: true
        type: string
      release-notes:
        description: Body text for the GitHub Release
        required: false
        type: string
        default: ""
      assets-artifact-name:
        description: Name of a job artifact (uploaded by the caller via actions/upload-artifact) holding the files to attach. Empty means a notes-only release with no assets.
        required: false
        type: string
        default: ""
      manifest-filename:
        description: Filename of manifest.json within the assets artifact, if one exists. Empty skips the post-publish hash re-verification.
        required: false
        type: string
        default: ""
      target-commit:
        description: Commit the release's tag is created at when the tag does not exist yet. Empty means the calling workflow's own commit (github.sha). gh-promote.yml passes the source build's commit, whose tag it already created.
        required: false
        type: string
        default: ""
    secrets:
      RELEASE_APP_ID:
        description: Optional — TurboPanel Release GitHub App id. When set (with the private key), the release is created with an App token instead of GITHUB_TOKEN.
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: Optional — the App's private key PEM.
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      # One release publish at a time per repo — gh release create on a tag
      # that's mid-publish from a concurrent run would race.
      group: gh-release-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_COMMIT: ${{ inputs.target-commit || github.sha }}
    steps:
      - name: Mint a Release App token
        if: ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Use the Release App token for the rest of the job
        if: steps.app-token.outputs.token != ''
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "GH_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"

      - name: Download release assets
        if: inputs.assets-artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.assets-artifact-name }}
          path: release-assets

      - name: Require non-empty assets when an artifact name was given
        if: inputs.assets-artifact-name != ''
        run: |
          set -eu
          if [ -z "$(ls -A release-assets 2>/dev/null)" ]; then
            echo "::error::assets-artifact-name was set but release-assets/ is empty after download"
            exit 1
          fi

      - name: Create the GitHub Release
        run: |
          set -eu
          _tag="v${{ inputs.version }}"
          _title="${_tag} (${{ inputs.channel }})"
          if [ -n "${{ inputs.assets-artifact-name }}" ]; then
            gh release create "$_tag" \
              --repo "${{ github.repository }}" \
              --target "$TARGET_COMMIT" \
              --prerelease \
              --title "$_title" \
              --notes "${{ inputs.release-notes }}" \
              release-assets/*
          else
            gh release create "$_tag" \
              --repo "${{ github.repository }}" \
              --target "$TARGET_COMMIT" \
              --prerelease \
              --title "$_title" \
              --notes "${{ inputs.release-notes }}"
          fi

      - name: Verify release assets against the manifest
        if: inputs.manifest-filename != ''
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import sys
          import urllib.request

          manifest_path = os.path.join(
              "release-assets", "${{ inputs.manifest-filename }}"
          )
          with open(manifest_path) as f:
              manifest = json.load(f)

          repo = "${{ github.repository }}"
          tag = "v${{ inputs.version }}"

          # Walk the manifest for every artifact entry — an object carrying
          # url + sha256 + size — wherever it sits. The daemon's manifest
          # nests them under binaryArtifacts / jsFallbackArtifact /
          # orchestrationArtifact; the instance's and the UI's put them under
          # artifacts.<name>. One verifier, every shape.
          def walk(node, path):
              if isinstance(node, dict):
                  if {"url", "sha256", "size"} <= node.keys():
                      yield path, node
                      return
                  for key, value in node.items():
                      yield from walk(value, f"{path}.{key}" if path else key)
              elif isinstance(node, list):
                  for i, value in enumerate(node):
                      yield from walk(value, f"{path}[{i}]")

          checks = list(walk(manifest, ""))
          if not checks:
              print(
                  f"::error::{manifest_path} names no artifacts (no object with url+sha256+size)",
                  file=sys.stderr,
              )
              sys.exit(1)

          failed = False
          for name, entry in checks:
              filename = entry["url"].rsplit("/", 1)[-1]
              release_url = (
                  f"https://github.com/{repo}/releases/download/{tag}/{filename}"
              )
              # The manifest must point consumers at this exact release asset
              # (the callers set the manifest's base to the tag-pinned
              # download path); anything else is a manifest that verifies
              # here but sends installs somewhere we never published.
              if entry["url"] != release_url:
                  print(
                      f"::error::{name} manifest url is not this release's asset: "
                      f"manifest={entry['url']} expected={release_url}",
                      file=sys.stderr,
                  )
                  failed = True
                  continue
              req = urllib.request.Request(
                  release_url, headers={"User-Agent": "turbopanel-release-verify"}
              )
              with urllib.request.urlopen(req) as resp:
                  data = resp.read()
              digest = hashlib.sha256(data).hexdigest()
              if digest != entry["sha256"] or len(data) != entry["size"]:
                  print(
                      f"::error::{name} release-asset mismatch: "
                      f"expected sha256={entry['sha256']} size={entry['size']} "
                      f"got sha256={digest} size={len(data)} url={release_url}",
                      file=sys.stderr,
                  )
                  failed = True

          if failed:
              sys.exit(1)
          print(
              f"Verified {len(checks)} {tag} release asset(s) for commit "
              f"{manifest.get('commit', '?')}"
          )
          PY

      - name: Point the rolling rc pre-release at this manifest
        # The rc rail (Road to 0.1.x, `rc-channel`) is one rolling
        # pre-release tagged `rc` whose only asset is a manifest.json: daemons
        # following rc read releases/download/rc/manifest.json, and every
        # URL inside it is tag-pinned to the versioned release verified
        # above — so the rolling release never carries the binaries, only
        # the pointer. Created on first use, then the manifest is replaced
        # in place. Only runs when the release verified clean, and only for
        # the rc channel: a release channel is `releases/latest`, which is
        # GitHub's own pointer (moved by scripts/promote-release.sh).
        if: inputs.manifest-filename != '' && inputs.channel == 'rc'
        run: |
          set -eu
          _repo="${{ github.repository }}"
          if ! gh release view rc --repo "$_repo" >/dev/null 2>&1; then
            gh release create rc \
              --repo "$_repo" \
              --target "$TARGET_COMMIT" \
              --prerelease \
              --title "rc (rolling)" \
              --notes "Rolling rc channel pointer. Its manifest.json names the current rc pre-release's assets; see that release for the bytes."
          fi
          gh release upload rc --repo "$_repo" --clobber "release-assets/${{ inputs.manifest-filename }}"
          gh release edit rc --repo "$_repo" --prerelease --notes "Rolling rc channel pointer — currently v${{ inputs.version }}. Its manifest.json names that pre-release's assets; see the versioned release for the bytes."
          echo "rc pointer now names v${{ inputs.version }}"
