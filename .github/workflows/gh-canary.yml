# Reusable canary-publish workflow, called by TurboPanel/turbopaneld,
# TurboPanel/turbopanel and TurboPanel/ui after every green trunk build —
# the rolling sibling of gh-release.yml. Where a release is a versioned,
# immutable GitHub Release on a vX.Y.Z tag, the canary channel is ONE
# rolling pre-release per repo, tagged `canary`, whose assets are replaced
# in place on every trunk merge (decided 2026-09-19: one release, not one
# per merge, so the Releases page stays readable).
#
# What keeps that honest:
#
#   - every asset carries the build's version in its filename
#     (`<pkg>-<X.Y.Z>-canary.<N>-<arch>.tar.zst`), so a manifest never
#     names a file another build will overwrite — uploads only ever add,
#     and `manifest.json` is the one file replaced in place, uploaded LAST
#     so a consumer that reads it finds every asset it names already there;
#   - the assets are re-verified from the live download URLs against the
#     manifest's sha256 + size after upload, the same "re-download and hash
#     it" check gh-release.yml and publish-daemon-trunk.yml run;
#   - the last `keep` builds' assets stay, each with its own
#     `manifest-<version>.json` copy, so a canary host can be pinned back a
#     few merges with `--manifest-url` — older builds' assets are deleted
#     after a successful publish;
#   - the `canary` tag is force-moved to the built commit so the release
#     page's "compare" and source links describe the bytes it serves. The
#     tag sits outside the `release tags` rulesets (those match v[0-9]*),
#     so GITHUB_TOKEN may move it;
#   - a build of a commit that is already BEHIND the live canary is not
#     published: two trunk builds can finish out of order (the instance's
#     Build is ~25 min), and the older one landing last must not roll the
#     channel back. Such a run ends green with a notice, publishing nothing.
#
# Consumers read https://github.com/<repo>/releases/download/canary/manifest.json —
# the built-in location the daemon (src/update/urls.ts), the control plane
# (src/lib/update/channel.ts) and run.sh advertise for `canary`.
#
# What this does NOT do: build anything. The caller compiles, packages and
# writes the manifest with ARTIFACT_BASE_URL set to this repo's
# releases/download/canary path, then hands the files over as a job artifact.

# Permissions — the caller's job must grant at least:
#
#   permissions:
#     contents: write
#
# The GITHUB_TOKEN creates and edits the rolling `canary` release, uploads and
# prunes its assets, and force-moves the `canary` tag. A commit that changes
# .github/workflows can only be tagged by a GitHub App token with the
# Workflows permission, so a caller should also pass the optional
# RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY secrets (without them the tag move
# warns and the tag pointer lags; assets and manifests still publish). Downloading the
# caller's job artifact from the same run needs no `actions` permission. A
# caller job that grants less than this workflow declares fails before any
# step runs ("The nested job … is requesting …, but is only allowed …").

name: GitHub Canary

on:
  workflow_call:
    inputs:
      version:
        description: The build's version string without a leading v (e.g. 0.1.6-canary.3; the Version From Tags action, mode canary, works it out)
        required: true
        type: string
      commit:
        description: The commit these assets were built from; the `canary` tag is moved to it
        required: true
        type: string
      assets-artifact-name:
        description: Name of a job artifact (uploaded by the caller via actions/upload-artifact) holding every asset plus the manifest
        required: true
        type: string
      manifest-filename:
        description: Filename of the manifest within the assets artifact
        required: false
        type: string
        default: manifest.json
      keep:
        description: How many builds' assets stay on the rolling release (older ones are pruned after a successful publish)
        required: false
        type: number
        default: 20

    secrets:
      RELEASE_APP_ID:
        description: Optional — TurboPanel Release GitHub App id. Moving the `canary` tag to a commit that changes .github/workflows needs the App's Workflows permission, which GITHUB_TOKEN can never hold.
        required: false
      RELEASE_APP_PRIVATE_KEY:
        description: Optional — the App's private key PEM.
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      # One canary publish at a time per repo: two runs uploading and
      # pruning the same rolling release would race each other's manifest.
      group: gh-canary-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: canary
    steps:
      - name: Download canary assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.assets-artifact-name }}
          path: canary-assets

      - name: Require the manifest and at least one asset
        run: |
          set -eu
          if [ ! -s "canary-assets/${{ inputs.manifest-filename }}" ]; then
            echo "::error::canary-assets/${{ inputs.manifest-filename }} is missing or empty"
            exit 1
          fi
          _n="$(find canary-assets -type f ! -name "${{ inputs.manifest-filename }}" | wc -l)"
          if [ "$_n" -lt 1 ]; then
            echo "::error::the assets artifact holds only the manifest — nothing to publish"
            exit 1
          fi
          # Every asset filename must carry this build's version, or a later
          # build could overwrite it while an older manifest still names it.
          for _f in canary-assets/*; do
            _name="$(basename "$_f")"
            [ "$_name" = "${{ inputs.manifest-filename }}" ] && continue
            case "$_name" in
              *"${{ inputs.version }}"*) ;;
              *) echo "::error::asset ${_name} does not carry the build version ${{ inputs.version }} in its name"; exit 1 ;;
            esac
          done

      - name: Refuse to move the canary backwards
        id: guard
        run: |
          set -eu
          _repo="${{ github.repository }}"
          _new="${{ inputs.commit }}"
          _live=""
          if _json="$(curl -fsSL --proto '=https' --proto-redir '=https' "https://github.com/${_repo}/releases/download/${TAG}/${{ inputs.manifest-filename }}" 2>/dev/null)"; then
            _live="$(printf '%s' "$_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))')"
          fi
          if [ -z "$_live" ] || [ "$_live" = "$_new" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          _status="$(gh api "/repos/${_repo}/compare/${_live}...${_new}" --jq .status 2>/dev/null || echo unknown)"
          case "$_status" in
            behind)
              echo "::notice::canary already serves ${_live}, which is ahead of ${_new} — this older build is not published"
              echo "proceed=false" >> "$GITHUB_OUTPUT" ;;
            *)
              # ahead (the normal case), identical, diverged, or unknown
              # (a force-moved history): publish. Trunk is linear, so
              # diverged and unknown are not expected to occur.
              echo "proceed=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Ensure the rolling canary pre-release exists
        if: steps.guard.outputs.proceed == 'true'
        run: |
          set -eu
          _repo="${{ github.repository }}"
          if ! gh release view "$TAG" --repo "$_repo" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$_repo" \
              --target "${{ inputs.commit }}" \
              --prerelease \
              --title "canary (rolling)" \
              --notes "Rolling canary channel: the newest green trunk build, replaced on every merge. Not a release."
          fi

      - name: Upload this build's assets, manifest last
        if: steps.guard.outputs.proceed == 'true'
        # The manifest goes up twice: once under its own version
        # (`manifest-<version>.json`, kept and pruned with the build so the
        # build stays pinnable) and once as the rolling `manifest.json` the
        # channel reads, uploaded last so nothing it names is missing.
        run: |
          set -eu
          _repo="${{ github.repository }}"
          for _f in canary-assets/*; do
            _name="$(basename "$_f")"
            [ "$_name" = "${{ inputs.manifest-filename }}" ] && continue
            gh release upload "$TAG" "$_f" --repo "$_repo" --clobber
          done
          _pinned="manifest-${{ inputs.version }}.json"
          cp "canary-assets/${{ inputs.manifest-filename }}" "canary-assets/${_pinned}"
          gh release upload "$TAG" "canary-assets/${_pinned}" --repo "$_repo" --clobber
          gh release upload "$TAG" "canary-assets/${{ inputs.manifest-filename }}" --repo "$_repo" --clobber

      - name: Verify the published assets against the manifest
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import sys
          import time
          import urllib.request

          manifest_path = os.path.join(
              "canary-assets", "${{ inputs.manifest-filename }}"
          )
          with open(manifest_path) as f:
              manifest = json.load(f)

          repo = "${{ github.repository }}"
          tag = os.environ["TAG"]

          # Same walker as gh-release.yml: any object carrying url + sha256 +
          # size, wherever it sits, is an artifact to check.
          def walk(node, path):
              if isinstance(node, dict):
                  if {"url", "sha256", "size"} <= node.keys():
                      yield path, node
                      return
                  for key, value in node.items():
                      yield from walk(value, f"{path}.{key}" if path else key)
              elif isinstance(node, list):
                  for i, value in enumerate(node):
                      yield from walk(value, f"{path}[{i}]")

          checks = list(walk(manifest, ""))
          if not checks:
              print(
                  f"::error::{manifest_path} names no artifacts (no object with url+sha256+size)",
                  file=sys.stderr,
              )
              sys.exit(1)

          def fetch(url):
              req = urllib.request.Request(
                  url, headers={"User-Agent": "turbopanel-canary-verify"}
              )
              # A freshly replaced asset can lag a few seconds behind the
              # by-name redirect; retry before calling it a mismatch.
              last = None
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req) as resp:
                          return resp.read()
                  except Exception as exc:  # noqa: BLE001
                      last = exc
                      time.sleep(3 * (attempt + 1))
              raise last

          failed = False
          for name, entry in checks:
              filename = entry["url"].rsplit("/", 1)[-1]
              expected_url = (
                  f"https://github.com/{repo}/releases/download/{tag}/{filename}"
              )
              if entry["url"] != expected_url:
                  print(
                      f"::error::{name} manifest url is not this rolling release's asset: "
                      f"manifest={entry['url']} expected={expected_url}",
                      file=sys.stderr,
                  )
                  failed = True
                  continue
              data = fetch(expected_url)
              digest = hashlib.sha256(data).hexdigest()
              if digest != entry["sha256"] or len(data) != entry["size"]:
                  print(
                      f"::error::{name} canary-asset mismatch: "
                      f"expected sha256={entry['sha256']} size={entry['size']} "
                      f"got sha256={digest} size={len(data)} url={expected_url}",
                      file=sys.stderr,
                  )
                  failed = True

          # The manifest itself must be the one we just uploaded — the by-name
          # redirect has to resolve to the new bytes, not a cached predecessor.
          with open(manifest_path, "rb") as f:
              local = f.read()
          live = fetch(
              f"https://github.com/{repo}/releases/download/{tag}/"
              + "${{ inputs.manifest-filename }}"
          )
          if hashlib.sha256(live).hexdigest() != hashlib.sha256(local).hexdigest():
              print(
                  "::error::live manifest.json does not match the uploaded one",
                  file=sys.stderr,
              )
              failed = True

          if failed:
              sys.exit(1)
          print(
              f"Verified {len(checks)} canary asset(s) for commit "
              f"{manifest.get('commit', '?')} ({manifest.get('version', '?')})"
          )
          PY

      - name: Prune builds older than the newest ${{ inputs.keep }}
        if: steps.guard.outputs.proceed == 'true'
        # Only after a clean verify: a failed publish never deletes the
        # previous build's bytes, so the last good manifest keeps resolving.
        env:
          REPO: ${{ github.repository }}
          KEEP: ${{ inputs.keep }}
          MANIFEST_NAME: ${{ inputs.manifest-filename }}
          CURRENT_VERSION: ${{ inputs.version }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess

          repo = os.environ["REPO"]
          tag = os.environ["TAG"]
          keep = int(os.environ["KEEP"])
          manifest_name = os.environ["MANIFEST_NAME"]
          current = os.environ["CURRENT_VERSION"]

          # Every per-build file carries its build's version, `<X.Y.Z>-canary.<id>`:
          # `<pkg>-<version>-<arch>.tar.zst`, `<pkg>-<version>.tar.gz`, the pinned
          # `manifest-<version>.json`. The id is the per-version counter
          # (`0.1.6-canary.3`; builds cut before versions came from tags carry
          # the workflow run number, `0.1.3-canary.412`) or, for builds cut
          # before 2026-09-28, a timestamp
          # (`<yyyymmdd>-<hhmmss>-<sha7>`). The id ends at a `-` or `.` or the end
          # of the name. The timestamp form is tried first and a counter may not be
          # followed by `-<hhmmss>-`, so a counter never takes a timestamp's date.
          build_re = re.compile(
              r"(?<![\d.])(\d+\.\d+\.\d+)-canary\."
              r"(\d{8}-\d{6}-[0-9a-f]{7}|\d+(?!-\d{6}-))"
              r"(?=[-.]|$)"
          )


          def label(build):
              return f"{build[0]}-canary.{build[1]}"


          def order(build):
              # Counter builds are always newer than timestamped ones. Counters
              # sort numerically (never as text) within their version, and the
              # version goes first so the order holds even if a counter restarts
              # at a new version; timestamps sort as text.
              version, build_id = build
              if build_id.isdigit():
                  return (1, tuple(int(p) for p in version.split(".")), int(build_id), "")
              return (0, (), 0, build_id)


          def list_assets():
              out = subprocess.run(
                  ["gh", "release", "view", tag, "--repo", repo, "--json", "assets"],
                  check=True, capture_output=True, text=True,
              ).stdout
              return [a["name"] for a in json.loads(out)["assets"]]


          def group(names):
              # All files of one build share its (version, id), manifest or not:
              # a build whose pinned manifest is already gone (left over by an
              # older prune that only matched manifests) still ages out.
              by_build = {}
              unknown = []
              for name in names:
                  if name == manifest_name:
                      continue
                  m = build_re.search(name)
                  if m:
                      by_build.setdefault(m.groups(), []).append(name)
                  else:
                      unknown.append(name)
              return by_build, unknown


          def delete(name):
              subprocess.run(
                  ["gh", "release", "delete-asset", tag, name, "--repo", repo, "--yes"],
                  check=True,
              )
              print(f"pruned {name}")


          by_build, unknown = group(list_assets())
          if unknown:
              shown = ", ".join(sorted(unknown)[:10])
              more = f" (+{len(unknown) - 10} more)" if len(unknown) > 10 else ""
              print(f"::notice::{len(unknown)} asset(s) carry no <X.Y.Z>-canary.<id> and were left alone: {shown}{more}")

          builds = sorted(by_build, key=order, reverse=True)
          # The build this run just published is never pruned, whatever the order says.
          stale = [b for b in builds[keep:] if label(b) != current]
          if not stale:
              print(f"{len(builds)} build(s) on the rolling release, keep={keep}: nothing to prune")
              raise SystemExit(0)
          files = 0
          for build in stale:
              for name in sorted(by_build[build]):
                  delete(name)
                  files += 1
          print(f"kept {len(builds) - len(stale)} build(s), pruned {len(stale)} ({files} file(s))")
          PY

      - name: Check for Release App credentials
        if: steps.guard.outputs.proceed == 'true'
        # secrets are not available in `if:` — resolve them into an output.
        id: app-creds
        env:
          HAS_APP: ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: echo "has-app=$HAS_APP" >> "$GITHUB_OUTPUT"

      - name: Mint a Release App token for the tag move
        if: steps.guard.outputs.proceed == 'true' && steps.app-creds.outputs.has-app == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Move the canary tag to this build's commit and refresh the notes
        if: steps.guard.outputs.proceed == 'true'
        env:
          # GITHUB_TOKEN cannot move a ref to a commit that changes
          # .github/workflows (HTTP 403, "Resource not accessible by
          # integration"): that needs the `workflows` permission, which only a
          # GitHub App token can hold. Use the App token when there is one.
          TAG_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -eu
          _repo="${{ github.repository }}"
          _tag_ok=1
          if ! GH_TOKEN="${TAG_TOKEN:-$GH_TOKEN}" gh api --method PATCH "/repos/${_repo}/git/refs/tags/${TAG}" \
            -f sha="${{ inputs.commit }}" -F force=true >/dev/null; then
            _tag_ok=0
            if [ -n "${TAG_TOKEN:-}" ]; then
              echo "::error::the Release App token could not move the ${TAG} tag (does the App have the Workflows permission?)"
              exit 1
            fi
            echo "::warning::could not move the ${TAG} tag to ${{ inputs.commit }} with GITHUB_TOKEN (expected when the commit changes .github/workflows; pass RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY, with the App's Workflows permission). The assets and manifest are published; only the tag pointer lags."
          fi
          gh release edit "$TAG" --repo "$_repo" --prerelease \
            --notes "Rolling canary channel — currently ${{ inputs.version }} (commit ${{ inputs.commit }}), replaced on every green trunk merge. Follow it with TURBOPANEL_UPDATE_CHANNEL=canary; pin one build with TURBOPANEL_MANIFEST_URL pointing at its manifest-<version>.json here. Not a release: the newest ${{ inputs.keep }} builds are kept, older ones are pruned."
          if [ "$_tag_ok" = 1 ]; then
            echo "canary now serves ${{ inputs.version }} from ${{ inputs.commit }}"
          else
            echo "canary serves ${{ inputs.version }}; the tag pointer is still on the previous commit"
          fi
