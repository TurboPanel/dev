# Reusable "promote-ok" recheck — looks again at the promote-ok check of the
# open promotion PRs when what they were waiting for may now exist.
#
# The caller triggers it with `workflow_run` on whatever produces the missing
# piece — the trunk CI, the canary publish, and Publish Release Candidate —
# and this job judges the current head of the open trunk -> staging and
# staging -> live PRs again (scripts/promote/promote-recheck.sh, which runs
# promote-ok.sh) and writes the verdict to the head's `promote-ok` check run
# (promote-ok-report.sh): green once what the PR publishes exists, still
# pending while it does not. Nothing is re-run, cancelled or waited for; each
# look takes seconds.
#
# It then does the same for the commit the triggering run was for, when that
# commit is no longer a PR's head: the RC PR moved on to a newer trunk commit
# before this one's canary finished. That commit's check turns green if its
# canary now exists and is otherwise closed as neutral (superseded), so no
# trunk commit keeps a pending or red promote-ok it can never lose. It reads
# that commit from the caller's own event (a reusable workflow sees the
# caller's `github` context), so callers pass nothing for it. A run that
# another run started (the canary) carries the branch tip as its head, not
# the commit it built, so the caller's canary workflow names that commit in
# its `run-name` ("Canary <commit>"); without it, only the PR heads are
# looked at.
#
# It fails its own run only when it could not write a verdict, so a person
# notices; anything it cannot read is a warning. `dry-run: true` only reports.

# Permissions — the caller's job must grant at least:
#
#   permissions:
#     contents: read
#     actions: read
#     pull-requests: read
#     checks: write
#
# contents: the canary release, tags, releases and commits promote-ok.sh reads.
# actions: the trunk CI runs. pull-requests: finds the open promotion PRs.
# checks: writes the promote-ok check runs. A caller job that grants less than
# this workflow declares fails before any step runs.

name: Promote OK Recheck

on:
  workflow_call:
    inputs:
      repo-kind:
        description: daemon | instance | ui | notes-only (as for gh-promote-ok.yml)
        required: true
        type: string
      ci-workflow:
        description: The trunk CI workflow file (as for gh-promote-ok.yml)
        required: true
        type: string
      dev-ref:
        description: The TurboPanel/dev commit this workflow was called at (must equal the `uses:` pin — the script lives there)
        required: true
        type: string
      dry-run:
        description: Report what would be written and change nothing
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: write

jobs:
  recheck:
    name: recheck
    runs-on: ubuntu-latest
    # A few looks of seconds each; this only stops a hung call.
    timeout-minutes: 10
    steps:
      - name: Check out the promotion scripts (TurboPanel/dev)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/dev
          ref: ${{ inputs.dev-ref }}
          path: .promote
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/promote
          sparse-checkout-cone-mode: false

      - name: Judge the open promotion PRs again and report promote-ok
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_KIND: ${{ inputs.repo-kind }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          DRY_RUN: ${{ inputs.dry-run }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_TITLE: ${{ github.event.workflow_run.display_title }}
        run: sh .promote/scripts/promote/promote-recheck.sh
