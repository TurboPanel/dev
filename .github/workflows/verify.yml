name: Verify

on:
  push:
    branches:
      - trunk
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Typecheck + Vitest LCOV, then Sonar quality gate. If Sonar fails,
  # the workflow stops. Automatic Analysis must stay off
  # (Administration → Analysis Method).
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: dev-sonar-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for SonarCloud new-code / blame (shallow clones skew the gate).
          fetch-depth: 0

      - name: Require SONAR_TOKEN
        # Fork PRs and Dependabot PRs cannot receive repository secrets — GitHub
        # withholds them from the dependabot[bot] actor even on same-repo
        # branches — so the require is skipped there and the rest of the chain
        # still gates; the scan below then skips on the empty token. Every other
        # trigger (trunk pushes, same-repo PRs, workflow_call) must have it.
        if: >-
          github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing — add the secret on TurboPanel/dev (or org)."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Keep in step with NODE_VERSION in scripts/lib/paths.sh (26.7.0).
          node-version: "26.7.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check third-party notices
        run: pnpm notices:check

      - name: Install osv-scanner
        run: |
          curl -sSfL --retry 3 --retry-connrefused --retry-delay 2 -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  /usr/local/bin/osv-scanner" | sha256sum -c -
          chmod +x /usr/local/bin/osv-scanner

      - name: Dependency vulnerability scan (osv-scanner)
        run: osv-scanner scan source --recursive .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: SonarQube Scan
        # Skipped only when SONAR_TOKEN is empty (fork or Dependabot PR).
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # ClickHouse/Tabix metrics infrastructure is retired (DuckDB + Parquet /
  # Analytics Engine replaced it). The guard lives in TurboPanel/turbopaneld
  # (scripts/check-metrics-legacy.ts) and scans sibling checkouts when present,
  # so check this repo out next to it — a clean single-repo turbopaneld CI run
  # cannot see PRs made here.
  metrics-legacy:
    runs-on: ubuntu-latest
    concurrency:
      group: dev-metrics-legacy-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dev

      - name: Check out turbopaneld (metrics-legacy guard)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/turbopaneld
          path: turbopaneld

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.7).
          deno-version: "2.9.7"

      - name: Check metrics legacy (no ClickHouse/Tabix references)
        working-directory: turbopaneld
        run: deno task check:metrics-legacy
