name: Verify

on:
  push:
    branches:
      - trunk
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Typecheck + Vitest LCOV, then Sonar quality gate. If Sonar fails,
  # the workflow stops. Automatic Analysis must stay off
  # (Administration → Analysis Method).
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: dev-sonar-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for SonarCloud new-code / blame (shallow clones skew the gate).
          fetch-depth: 0

      - name: Require SONAR_TOKEN
        # Fork PRs and Dependabot PRs cannot receive repository secrets — GitHub
        # withholds them from the dependabot[bot] actor even on same-repo
        # branches — so the require is skipped there and the rest of the chain
        # still gates; the scan below then skips on the empty token. Every other
        # trigger (trunk pushes, same-repo PRs, workflow_call) must have it.
        if: >-
          github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing — add the secret on TurboPanel/dev (or org)."
            exit 1
          fi

      # The Version From Tags action the sibling repos pin, run for real: this
      # repo has no release tags and no canary release, so its answer is fixed
      # (the first version, first canary). Proves the action's path to
      # scripts/promote/version.sh, its outputs, and the "no canary release"
      # branch against the live API, not a fake gh.
      - name: Self-test the Version From Tags action
        id: version-self-test
        uses: ./.github/actions/version
        with:
          mode: canary

      - name: Check the Version From Tags answer
        env:
          BASE: ${{ steps.version-self-test.outputs.base }}
          NUMBER: ${{ steps.version-self-test.outputs.number }}
          VERSION: ${{ steps.version-self-test.outputs.version }}
        run: |
          set -eu
          echo "base=$BASE number=$NUMBER version=$VERSION"
          test "$BASE" = "0.1.0"
          test "$NUMBER" = "1"
          test "$VERSION" = "0.1.0-canary.1"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Keep in step with NODE_VERSION in scripts/lib/paths.sh (26.7.0).
          node-version: "26.7.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Secret scan (every tracked file)
        # The pre-commit hook scans staged files only; CI scans the whole tree.
        run: sh scripts/scan-secrets.sh --all

      - name: Check vocabulary
        run: pnpm check:vocabulary

      - name: Check third-party notices
        run: pnpm notices:check

      # Fails only on a HIGH/CRITICAL advisory that has a fixed version; the
      # rest are warnings. Override: [[IgnoredVulns]] in osv-scanner.toml. The
      # sibling repos call this same action pinned by sha.
      - name: Dependency advisory gate (osv-scanner)
        uses: ./.github/actions/osv-scan

      - name: Check out sibling repos (cross-repo pin tests)
        # Public repos, trunk. Cloned outside the workspace so osv-scanner,
        # tsc and Sonar never see them. TURBOPANEL_REQUIRE_SIBLINGS makes a
        # missing sibling an error, so the cross-repo tests cannot skip here.
        run: |
          mkdir -p "$RUNNER_TEMP/siblings"
          for repo in turbopanel turbopaneld ui website; do
            git clone --quiet --depth 1 --branch trunk \
              "https://github.com/TurboPanel/${repo}.git" "$RUNNER_TEMP/siblings/${repo}"
          done
          echo "TURBOPANEL_SIBLINGS_DIR=$RUNNER_TEMP/siblings" >> "$GITHUB_ENV"
          echo "TURBOPANEL_REQUIRE_SIBLINGS=1" >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: SonarQube Scan
        # Skipped only when SONAR_TOKEN is empty (fork or Dependabot PR).
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # ClickHouse/Tabix metrics infrastructure is retired (DuckDB + Parquet /
  # Analytics Engine replaced it). The guard lives in TurboPanel/turbopaneld
  # (scripts/check-metrics-legacy.ts) and scans sibling checkouts when present,
  # so check this repo out next to it — a clean single-repo turbopaneld CI run
  # cannot see PRs made here.
  metrics-legacy:
    runs-on: ubuntu-latest
    concurrency:
      group: dev-metrics-legacy-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dev

      - name: Check out turbopaneld (metrics-legacy guard)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/turbopaneld
          # Always the sibling's trunk: another repo's staging/live move on
          # that repo's own release schedule.
          ref: trunk
          path: turbopaneld

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.7).
          deno-version: "2.9.7"

      - name: Check metrics legacy (no ClickHouse/Tabix references)
        working-directory: turbopaneld
        run: deno task check:metrics-legacy

  # Single aggregate check for the branch rulesets. It needs every job that
  # runs on pull_request and fails unless all of them succeeded. Required-check
  # contexts move from the individual job names to this one context so a job
  # rename or a new job never blocks merges on a name the ruleset still waits
  # for.
  #
  # When it runs: on a pull request, always — a cancelled or skipped need is a
  # failure there (no job above is conditional on PR events, so "skipped" can
  # only mean a dependency failed), and the required check must never be left
  # pending. On a push to trunk it is skipped when the run was cancelled or
  # when any need was cancelled: the jobs above sit in job-level concurrency
  # groups, so a newer push cancels this run's still-pending job without
  # cancelling the run itself. A superseded push is not a broken change, so it
  # must not paint the commit red.
  ci-ok:
    name: ci-ok
    needs: [verify, metrics-legacy]
    if: ${{ (github.event_name == 'pull_request' && always()) || (!cancelled() && !contains(needs.*.result, 'cancelled')) }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dev-ci-ok-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Fail unless every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null
