name: Verify

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: dev-verify-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # Job-level so Sonar `if:` / require-token steps can read the secret.
      # Empty only for fork PRs (secrets are not available to forks).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history for SonarCloud new-code / blame (shallow clones skew the gate).
          fetch-depth: 0

      # Fork PRs cannot receive repository secrets — skip Sonar there.
      # Same-repo PRs / trunk pushes should have SONAR_TOKEN for CI-based Sonar
      # + LCOV import. Until the secret is wired, fail this step visibly but
      # continue (typecheck/tests must still gate). Soft-fail matches daemon.
      - name: Require SONAR_TOKEN for trusted verification
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing — SonarCloud CI scan will be skipped. Add the secret on turbopanel/dev (or org) to enforce quality gate + LCOV import. Fork PRs may omit it."
            exit 1
          fi

      - name: Install pnpm
        # Honour packageManager in package.json (omit version input).
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Keep in step with NODE_VERSION in scripts/lib/paths.sh (24.17.0).
          node-version: "24.17.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage LCOV
        uses: actions/upload-artifact@v7
        with:
          name: dev-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      # Coverage import needs CI-based analysis (Automatic Analysis must be off
      # for turbopanel_dev). Skipped when SONAR_TOKEN is empty (forks, or until
      # the secret is configured — see soft-fail require step above).
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
