name: Verify

on:
  push:
    branches:
      - trunk
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Typecheck + Vitest LCOV, then Sonar quality gate. If Sonar fails,
  # the workflow stops. Automatic Analysis must stay off
  # (Administration → Analysis Method).
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: dev-sonar-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history for SonarCloud new-code / blame (shallow clones skew the gate).
          fetch-depth: 0

      - name: Require SONAR_TOKEN
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing — add the secret on turbopanel/dev (or org)."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Keep in step with NODE_VERSION in scripts/lib/paths.sh (24.17.0).
          node-version: "24.17.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage LCOV
        uses: actions/upload-artifact@v7
        with:
          name: dev-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
