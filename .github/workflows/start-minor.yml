# Start a new minor by hand: opens "Start X.Y.0" PRs into the trunk of
# turbopaneld, turbopanel and ui (the three that ship a minor together). This is
# the manual twin of what gh-next-version.yml does by itself when a `minor`
# label makes a repo's next number a new minor. Nothing merges itself.

name: Start a minor

on:
  workflow_dispatch:
    inputs:
      version:
        description: The minor to start (X.Y.0), e.g. 0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  start-minor:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a Release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: TurboPanel
          repositories: |
            turbopaneld
            turbopanel
            ui

      - name: Check out the promotion scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open the Start PRs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLI: ${{ github.workspace }}/scripts/promote/cli.mjs
          VERSION: ${{ inputs.version }}
        run: sh scripts/promote/start-minor.sh "$VERSION"
