[defaults]
# Debian /bin/sh is dash; ansible.builtin.shell defaults to it. Dash rejects
# `set -o pipefail` used by role install snippets (cache, Deno, Caddy, …).
executable = /bin/bash
# Playbooks live one level below orchestration/; inherit overlay roles plus the
# sibling daemon production roles (mirrors daemon/orchestration/playbooks/ansible.cfg).
# From playbooks/ → ../../../turbopaneld is the sibling checkout (~/turbopaneld).
roles_path = ../roles:../../../turbopaneld/orchestration/roles:/opt/turbopanel/vendor/ansible/galaxy-roles
collections_path = /opt/turbopanel/vendor/ansible/galaxy-collections:/usr/share/ansible/collections
