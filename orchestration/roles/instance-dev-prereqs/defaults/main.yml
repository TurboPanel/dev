---
# Shared libraries for @react-native/debugger-shell (Electron/Chromium).
# Debian 13+ may rename several to *t64; probe at runtime (see tasks).
instance_dev_prereq_specs:
  - libatk1.0-0
  - libatk-bridge2.0-0
  - libasound2
  - libcups2
  - libdrm2
  - libgbm1
  - libgtk-3-0
  - libnspr4
  - libnss3
  - libxcomposite1
  - libxdamage1
  - libxfixes3
  - libxkbcommon0
  - libxrandr2

# Command-line tools the dev repo's own scripts and tests call: the promote,
# changelog, OSV and Sonar helpers use jq. CI runners ship it; a fresh Debian 13
# dev box does not, and their tests fail with "jq: not found".
instance_dev_tool_packages:
  - jq
