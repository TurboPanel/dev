[defaults]
# Debian /bin/sh is dash; ansible.builtin.shell defaults to it. Dash rejects
# `set -o pipefail` used by role install snippets (cache, Deno, Caddy, …).
executable = /bin/bash
# Local orchestration runs against the daemon host; no remote SSH host keys.
host_key_checking = False
# Quiet the noisy "discovered interpreter" warnings; the venv python is correct.
interpreter_python = auto_silent
# local_tmp / home come from ANSIBLE_LOCAL_TEMP + ANSIBLE_HOME at invocation
# time (see the daemon's devOrchestrationAnsibleEnv()). ANSIBLE_HOME is
# /tmp/turbopanel-ansible.
# Vendored collections: the relative segment mirrors production
# share/orchestration → ../../vendor (does not apply from this checkout path);
# the absolute FHS entry is what co-located dev actually uses.
collections_path = ../../vendor/ansible/galaxy-collections:/opt/turbopanel/vendor/ansible/galaxy-collections:/usr/share/ansible/collections
retry_files_enabled = False
# Machine-readable JSONL on stdout for streaming consumers and structured daemon logs.
stdout_callback = ansible.posix.jsonl
callbacks_enabled = ansible.posix.jsonl
# Dev-owned overlay roles first, then the sibling turbopaneld checkout's shared
# production roles (standard co-located layout: ~/dev + ~/turbopaneld), then
# Galaxy roles under vendor (geerlingguy.docker — not the VirtFS checkout).
# Daemon converge still overrides via ANSIBLE_ROLES_PATH (dev-orchestration.ts).
roles_path = roles:../../turbopaneld/orchestration/roles:/opt/turbopanel/vendor/ansible/galaxy-roles
