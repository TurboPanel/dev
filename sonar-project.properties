sonar.projectKey=turbopanel_dev
sonar.projectName=dev
sonar.organization=turbopanel

# Match the TurboPanel vendored Python pin (daemon PYTHON_VERSION).
sonar.python.version=3.14

# Vitest LCOV from `pnpm test:coverage` (coverage/lcov.info). The TypeScript-
# specific key is deprecated; javascript.lcov covers both JS and TS.
# LCOV import only takes effect on CI-based analysis — Automatic Analysis must
# be off for turbopanel_dev (same constraint as turbopanel_turbopaneld).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**,\
  .local/**,\
  workers/**

sonar.coverage.exclusions=\
  node_modules/**,\
  dist/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  scripts/**,\
  workers/**

# Shell scripts are POSIX sh (#!/bin/sh / Debian dash), not Bash. Sonar shelldre
# rules that require [[ or Bash-oriented returns are false positives here.
sonar.issue.ignore.multicriteria=posixBracket,posixReturn,cleartextProbe,devShellPathPerms
sonar.issue.ignore.multicriteria.posixBracket.ruleKey=shelldre:S7688
sonar.issue.ignore.multicriteria.posixBracket.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.posixReturn.ruleKey=shelldre:S7682
sonar.issue.ignore.multicriteria.posixReturn.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.cleartextProbe.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.cleartextProbe.resourceKey=**/debug-hosting-probe.sh
# profile.d / zshrc.d PATH snippets must stay world-readable for login shells.
sonar.issue.ignore.multicriteria.devShellPathPerms.ruleKey=ansible:S2612
sonar.issue.ignore.multicriteria.devShellPathPerms.resourceKey=**/orchestration/roles/dev-shell-path/tasks/main.yml
