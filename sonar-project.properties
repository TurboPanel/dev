sonar.projectKey=turbopanel_dev
sonar.projectName=dev
sonar.organization=turbopanel

# CI-based analysis via .github/workflows/verify.yml (SONAR_TOKEN). Automatic
# Analysis must stay off for this project (SonarCloud → Administration →
# Analysis Method); otherwise the CI scanner fails.

# Match the TurboPanel vendored Python pin (daemon PYTHON_VERSION).
sonar.python.version=3.14

# Vitest LCOV from `pnpm test:coverage` (coverage/lcov.info). The TypeScript-
# specific key is deprecated; javascript.lcov covers both JS and TS.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Co-located tests (*.test.ts next to sources). Same roots for sources and
# tests + test.inclusions — do not leave sonar.tests unset (scanner then
# falls back to filename/directory heuristics).
sonar.sources=src,scripts
sonar.tests=src
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx

sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**,\
  .local/**

# Vitest coverage include is src/lib/**/*.ts + src/hooks/**/*.ts (see
# vitest.config.ts). Keep Ink chrome and spawn/integration helpers out of the
# coverage denominator so untested TUI surfaces do not fail Sonar-way Coverage
# on New Code ≥ 80%.
sonar.coverage.exclusions=\
  node_modules/**,\
  dist/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.tsx,\
  **/*.d.ts,\
  scripts/**,\
  src/app.tsx,\
  src/tui.tsx,\
  src/dev-services.ts,\
  src/theme.ts,\
  src/components/**,\
  src/lib/converge-service-log.ts,\
  src/lib/daemon-log.ts,\
  src/lib/daemon-install.ts,\
  src/lib/docker-access.ts,\
  src/lib/drizzle-studio.ts,\
  src/lib/instance-runtime.ts,\
  src/lib/open-url.ts,\
  src/lib/platform-docker-resources.ts,\
  src/lib/postgres-runtime.ts,\
  src/lib/reset-dev-database.ts,\
  src/lib/service-open.ts,\
  src/lib/service-restart.ts,\
  src/lib/spawn-trusted.ts,\
  src/lib/stack-versions.ts

# Vitest imports are not always recognized by Sonar analysis; S2187 ("Add some
# tests to this file") is a false positive on *.test.ts.
sonar.issue.ignore.multicriteria=denoS2187,posixBracket,posixReturn,cleartextProbe
sonar.issue.ignore.multicriteria.denoS2187.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.denoS2187.resourceKey=**/*.test.ts

# Shell scripts are POSIX sh (#!/bin/sh / Debian dash), not Bash. Sonar shelldre
# rules that require [[ or Bash-oriented returns are false positives here.
sonar.issue.ignore.multicriteria.posixBracket.ruleKey=shelldre:S7688
sonar.issue.ignore.multicriteria.posixBracket.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.posixReturn.ruleKey=shelldre:S7682
sonar.issue.ignore.multicriteria.posixReturn.resourceKey=**/*.sh
sonar.issue.ignore.multicriteria.cleartextProbe.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.cleartextProbe.resourceKey=**/debug-hosting-probe.sh
